<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>InTime OS - App Técnico Mobile</title>
  <style>
    :root {
      --primary: #0284C7;
      --primary-hover: #0369A1;
      --secondary: #0F172A;
      --surface: #1E293B;
      --accent: #38BDF8;
      --text: #F8FAFC;
      --muted: #94A3B8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--secondary);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background-color: var(--surface);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .logo-badge {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 16px;
      background: var(--secondary);
      border: 2px solid var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-weight: 800;
      font-size: 22px;
    }
    h1 { font-size: 22px; margin-bottom: 8px; }
    h1 span { color: var(--accent); }
    p { font-size: 14px; color: var(--muted); line-height: 1.5; margin-bottom: 20px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: var(--secondary);
      color: var(--text);
      font-size: 14px;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: none;
      background: var(--primary);
      color: white;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }
    button:active { background: var(--primary-hover); }
    .footer { margin-top: 20px; font-size: 11px; color: #64748B; }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="logo-badge" aria-label="Ícone InTime Technology">IT</div>
    <h1>In<span>Time</span> OS Mobile</h1>
    <p>Conectando ao servidor seguro da <strong>InTime Technology</strong> via Cloudflare Tunnel...</p>

    <form id="serverForm">
      <label for="serverUrl" style="display:block;text-align:left;font-size:12px;color:#94A3B8;margin-bottom:6px;">
        Endereço HTTPS do Servidor InTime:
      </label>
      <input
        id="serverUrl"
        type="url"
        required
        placeholder="https://os.intimetechnology.com.br"
        value="https://os.intimetechnology.com.br"
      />
      <button type="submit">Conectar ao Painel Técnico</button>
    </form>

    <div class="footer">
      In Time Technology e Systems LTDA<br/>
      CNPJ: 10.742.889/0001-36
    </div>
  </main>

  <script>
    (function () {
      const savedUrl = localStorage.getItem("INTIME_SERVER_URL") || "https://os.intimetechnology.com.br";
      const input = document.getElementById("serverUrl");
      input.value = savedUrl;

      document.getElementById("serverForm").addEventListener("submit", function (e) {
        e.preventDefault();
        const target = input.value.trim().replace(/\/+$/, "");
        if (target) {
          localStorage.setItem("INTIME_SERVER_URL", target);
          window.location.href = target + "/dashboard";
        }
      });
    })();
  </script>
</body>
</html>
