<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" fill="none" role="img" aria-label="Logotipo InTime Technology">
  <title>InTime Technology - Soluções e Suporte Técnico</title>
  <defs>
    <linearGradient id="intimeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="navyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Escudo Hexagonal / Relógio Tecnológico -->
  <rect x="8" y="8" width="64" height="64" rx="16" fill="url(#navyGradient)" stroke="#0284C7" stroke-width="2.5"/>
  <circle cx="40" cy="40" r="21" stroke="url(#intimeGradient)" stroke-width="3.5" stroke-dasharray="105 28" stroke-linecap="round"/>
  <!-- Ponteiros / Circuito -->
  <path d="M40 26V40L50 46" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="40" cy="40" r="4" fill="#10B981"/>
  <circle cx="56" cy="24" r="3" fill="#38BDF8"/>

  <!-- Tipografia Principal -->
  <text x="86" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5" fill="#0F172A">
    In<tspan fill="#0284C7">Time</tspan>
  </text>
  <text x="88" y="64" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3.5" fill="#64748B">
    TECHNOLOGY
  </text>
</svg>
